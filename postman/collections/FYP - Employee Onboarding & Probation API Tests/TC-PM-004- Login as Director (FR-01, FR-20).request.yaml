$kind: http-request
name: "TC-PM-004: Login as Director (FR-01, FR-20)"
description: |-
  TC-PM-004: Verifies that the Director user can authenticate.
  Requirement: FR-01 | NFR-02
  Expected: HTTP 200, role=DIRECTOR, token returned
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "director@onboard.dev",
      "password": "Password123!"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.collectionVariables.set('director_token', jsonData.token);
          pm.test('TC-PM-004: Login successful - DIRECTOR role returned', function () {
              pm.response.to.have.status(200);
              pm.expect(jsonData.user.role).to.eql('DIRECTOR');
          });
      }
    language: text/javascript
order: 4000
