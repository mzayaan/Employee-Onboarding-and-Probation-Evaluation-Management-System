$kind: http-request
name: "TC-PM-008: HR Views Pending Recommendations (FR-15, FR-20)"
description: |-
  TC-PM-008: HR Admin retrieves the list of probation recommendations awaiting HR review.
  Requirement: FR-15, FR-20 | NFR-03
  Expected: HTTP 200, array of recommendations with PENDING_HR_REVIEW status
url: "{{base_url}}/api/director/pending-hr"
method: GET
headers:
  Authorization: Bearer {{hr_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-PM-008: Pending HR recommendations returned', function () {
          pm.response.to.have.status(200);
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an('array');
      });
    language: text/javascript
order: 9000
