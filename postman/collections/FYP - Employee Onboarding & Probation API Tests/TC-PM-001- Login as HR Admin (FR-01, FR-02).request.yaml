$kind: http-request
name: "TC-PM-001: Login as HR Admin (FR-01, FR-02)"
description: |-
  TC-PM-001: Verifies that a valid HR Admin can authenticate and receive a JWT token.
  Requirement: FR-01, FR-02 | NFR-02
  Expected: HTTP 200, role=HR_ADMIN, token returned
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "hr@onboard.dev",
      "password": "Password123!"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.collectionVariables.set('hr_token', jsonData.token);
          pm.test('TC-PM-001: Login successful - HR_ADMIN role returned', function () {
              pm.response.to.have.status(200);
              pm.expect(jsonData.user.role).to.eql('HR_ADMIN');
          });
      }
    language: text/javascript
order: 1000
