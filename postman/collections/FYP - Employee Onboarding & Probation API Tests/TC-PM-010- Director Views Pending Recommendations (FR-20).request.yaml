$kind: http-request
name: "TC-PM-010: Director Views Pending Recommendations (FR-20)"
description: |-
  TC-PM-010: Director retrieves all recommendations awaiting final approval.
  Requirement: FR-20 | NFR-03
  Expected: HTTP 200, array of recommendations with PENDING_DIRECTOR status
url: "{{base_url}}/api/director/pending-director"
method: GET
headers:
  Authorization: Bearer {{director_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-PM-010: Director pending queue returned', function () {
          pm.response.to.have.status(200);
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an('array');
      });
    language: text/javascript
order: 10000
